[package]
name = "queryweave-sql"
# The five crates are versioned in lockstep.
version = "0.1.0"
description = "The SQL runtime of queryweave: database-agnostic sqlx query building (WHERE, ORDER BY, LIMIT/OFFSET, SET) from the data queryweave's derives generate."
authors = ["Eduard Mihai Mitrică"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository.workspace = true
keywords = ["sqlx", "sql", "filter", "pagination", "query"]
categories = ["database"]
edition.workspace = true
rust-version = "1.88"

[lints]
workspace = true

[dependencies]
queryweave = { path = "../queryweave", version = "0.1.0", default-features = false }

# The `sqlx` backend. No driver: it is generic over any database whose driver
# binds the domain's raw values (`BindValues`).
chrono = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
mutants.workspace = true

[features]
# Merge patches (`MergePatch`, `MergePatchNullableFields`, `ValidateNonNullable`
# and their runtime): on by default; turn the default features off for the
# filters alone.
default = ["merge-patch", "sqlx"]
merge-patch = ["queryweave/merge-patch"]
# sqlx's `QueryBuilder` as a query the SQL is written into.
sqlx = ["dep:sqlx", "dep:chrono"]

[dev-dependencies]
rstest.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The tests render and run the SQL on every database sqlx supports.
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "mysql", "sqlite", "chrono"] }
# The database tests (`tests/postgres.rs`, `tests/mysql.rs`) start their
# servers in containers.
testcontainers.workspace = true
# The feature checks' UI cases (`tests/ui/features`).
trybuild.workspace = true

# The SQL tests run through sqlx's `QueryBuilder`.
[[test]]
name = "sqlite"
required-features = ["sqlx"]

[[test]]
name = "postgres"
required-features = ["sqlx"]

[[test]]
name = "mysql"
required-features = ["sqlx"]
