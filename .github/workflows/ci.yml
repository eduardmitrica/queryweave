# queryweave's continuous integration: the same checks as `scripts/check.sh`.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (lints, unit, doc, feature and database tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain `rust-toolchain.toml` pins.
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # The runner has Docker, for the Postgres, MySQL and MariaDB containers.
      - run: sh scripts/check.sh ci
      # See the `ui` job: `check.sh` runs the feature UI cases too.
      - if: always()
        run: mkdir -p target/tests/target

  # The published crates' libraries, with every feature, build on the
  # `rust-version` they declare. Tests and dev-dependencies (SeaORM needs a
  # newer Rust) are not built: the MSRV promise is the libraries'.
  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: >-
          cargo +1.88.0 check --locked
          -p queryweave -p queryweave-api -p queryweave-sql -p queryweave-codegen -p queryweave-derive
          --all-features

  ui:
    name: UI tests (trybuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace -E 'test(/ui_tests/)'
      # rust-cache's post step cleans `target/tests/target` (where some test
      # tools build) without awaiting it, so its absence is an unhandled
      # `ENOENT`; trybuild builds in `target/tests/trybuild` only.
      - if: always()
        run: mkdir -p target/tests/target
