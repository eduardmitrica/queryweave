[package]
name = "queryweave-derive"
# The five crates are versioned in lockstep.
version = "0.1.0"
description = "Derive macros generating filtering, sorting, paging and merge-patch types for a domain model and the layers mirroring it."
authors = ["Eduard Mihai Mitrică"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository.workspace = true
keywords = ["derive", "filter", "sort", "pagination", "merge-patch"]
categories = ["development-tools::procedural-macro-helpers", "database", "web-programming"]
edition.workspace = true
# Checked with the oldest toolchain at hand: it may build on older ones.
rust-version = "1.91"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
queryweave-codegen = { path = "../queryweave-codegen", version = "0.1.0", default-features = false }

[features]
# Merge patches (`MergePatch`, `MergePatchNullableFields`, `ValidateNonNullable`
# and their runtime): on by default; turn the default features off for the
# filters alone.
default = ["merge-patch"]
merge-patch = ["queryweave-codegen/merge-patch"]

[dev-dependencies]
# The generated code names these; the derives themselves do not use them.
queryweave-api = { path = "../queryweave-api", features = ["serde", "utoipa", "schemars"] }
queryweave.path = "../queryweave"
queryweave-sql.path = "../queryweave-sql"
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["derive", "runtime-tokio", "postgres", "mysql", "chrono"] }
utoipa.workspace = true
validator = { workspace = true, features = ["derive"] }
garde.workspace = true
schemars.workspace = true

trybuild.workspace = true
chrono.workspace = true
insta.workspace = true
pretty_assertions.workspace = true
prettyplease.workspace = true
rstest.workspace = true
