[package]
name = "queryweave-custom-conventions"
description = "Test fixture: the queryweave derives under custom conventions, as a crate with its own rules would write them."
version = "0.2.0"
authors = ["Eduard Mihai Mitrică"]
edition.workspace = true
publish = false

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
queryweave-codegen.path = "../queryweave-codegen"
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["extra-traits", "full"] }

[dev-dependencies]
# The generated code names these (the runtime crates through the tests' own
# re-exporting modules); the derives themselves do not use them.
queryweave-api = { path = "../queryweave-api", features = ["serde", "utoipa"] }
queryweave.path = "../queryweave"
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
validator = { workspace = true, features = ["derive"] }

pretty_assertions.workspace = true
